name: powerank
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.30.0   
  firebase_auth: ^4.19.0  
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.8.3
  cloud_firestore: ^4.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

fonts:
  - family: SF-Pro-Text
    fonts:
      - asset: fonts/SF-Pro-Text-Regular.otf